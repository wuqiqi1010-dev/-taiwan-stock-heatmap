name: Update official TW stock quotes
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1-5'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate official daily quotes
        run: python scripts/update.py
      - name: Commit new quotes if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official Taiwan stock quotes'
            git push
          fi
