
name: V6 Historical Backfill Auto

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write

concurrency:
  group: historical-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find next incomplete batch
        id: batch
        shell: bash
        run: |
          python scripts/backfill_integrity.py --plan --months 7 >> "$GITHUB_OUTPUT"

      - name: Show progress
        run: |
          echo "TWSE candidates: ${{ steps.batch.outputs.total }}"
          echo "Next offset: ${{ steps.batch.outputs.offset }}"

      - name: Backfill next batch
        if: steps.batch.outputs.offset != '-1'
        run: |
          python scripts/backfill.py \
            --offset "${{ steps.batch.outputs.offset }}" \
            --limit 40 \
            --months 7

      - name: Commit historical data
        if: steps.batch.outputs.offset != '-1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add historical/twse/

          if ! git diff --cached --quiet; then
            git commit -m 'Auto backfill next TWSE batch'
            git push
          else
            echo 'No changes to commit'
          fi

      - name: Verify saved batch (fail visibly after preserving retry state)
        if: steps.batch.outputs.offset != '-1'
        run: |
          python scripts/backfill_integrity.py --check-batch \
            --offset "${{ steps.batch.outputs.offset }}" --limit 40 --months 7

      - name: All batches complete
        if: steps.batch.outputs.offset == '-1'
        run: |
          echo "All current TWSE candidates passed monthly integrity validation."
          echo "Coverage is TWSE only; exchange-session gaps and corporate actions require separate review."
