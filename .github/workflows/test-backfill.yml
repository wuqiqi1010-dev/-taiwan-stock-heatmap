name: Test historical backfill integrity
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/backfill*.py'
      - 'scripts/tpex_backfill.py'
      - 'tests/**'
      - '.github/workflows/*backfill*.yml'
      - 'themes.js'
      - 'index.html'
      - 'rotation.html'
  push:
    branches: ['fix/backfill-integrity-*', 'feat/tpex-*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/backfill.py scripts/backfill_integrity.py scripts/tpex_backfill.py
