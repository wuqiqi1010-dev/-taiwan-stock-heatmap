<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股市場雷達｜官方行情</title><style>:root{color-scheme:dark}body{margin:0;background:#0b1020;color:#e5edf7;font:15px system-ui,'Noto Sans TC',sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:27px}small,.muted{color:#a9b5c7}.panel{background:#151e31;border:1px solid #2a3851;border-radius:15px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.num{font-size:27px;font-weight:700}.up{color:#ff6868}.down{color:#54d79b}input{background:#0c1426;color:white;border:1px solid #46536c;border-radius:9px;padding:12px;width:min(100%,400px);box-sizing:border-box}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid #2a3851;padding:10px 6px}th{color:#a9b5c7}td:nth-child(n+3){font-variant-numeric:tabular-nums}#tablewrap{overflow-x:auto}.warn{border-left:4px solid #efb74c;padding-left:12px}button{background:#263d60;color:white;border:0;border-radius:8px;padding:10px;cursor:pointer}</style></head><body><main><h1>台股市場雷達</h1><p class="muted">官方上市櫃個股行情 · 自動更新原型</p><div class="panel warn">本頁目前是<strong>官方個股行情檢視版</strong>，不是完整產業熱力圖。產業分類、歷史強弱、法人流向及未來主流評分尚未實作。資料日期未驗證前不得視為當日行情。</div><div id="status" class="panel">正在載入官方資料…</div><div class="grid"><div class="panel"><small>有效股票筆數</small><div class="num" id="count">—</div></div><div class="panel"><small>上漲家數（有變動資料）</small><div class="num up" id="up">—</div></div><div class="panel"><small>下跌家數（有變動資料）</small><div class="num down" id="down">—</div></div></div><div class="panel"><h2>股票查詢</h2><p><input id="q" placeholder="輸入代號或名稱，例如 3037、欣興" aria-label="股票查詢"></p><div id="tablewrap"><table><thead><tr><th>代號</th><th>名稱</th><th>市場</th><th>收盤</th><th>漲跌%</th><th>成交額（元）</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted" id="hint"></p></div><p class="muted">資料來源：<a href="https://openapi.twse.com.tw/">TWSE</a>、<a href="https://www.tpex.org.tw/openapi/">TPEx</a>。數據僅供研究，請以交易所公告為準。</p></main><script>let stocks=[];const fmt=n=>n==null?'—':Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2});function render(){let q=document.getElementById('q').value.trim().toLowerCase();let matched=stocks.filter(x=>x.code.includes(q)||x.name.toLowerCase().includes(q));document.getElementById('rows').replaceChildren(...matched.slice(0,150).map(x=>{let tr=document.createElement('tr');[x.code,x.name,x.market,fmt(x.close),x.pct==null?'—':fmt(x.pct)+'%',fmt(x.turnover)].forEach((v,i)=>{let td=document.createElement('td');td.textContent=v;if(i===4&&x.pct!=null)td.className=x.pct>0?'up':x.pct<0?'down':'';tr.append(td)});return tr}));document.getElementById('hint').textContent=`符合 ${matched.length} 筆，顯示前 150 筆`;}document.getElementById('q').addEventListener('input',render);fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('尚無行情資料');return r.json()}).then(d=>{stocks=d.records||[];document.getElementById('count').textContent=fmt(stocks.length);document.getElementById('up').textContent=fmt(stocks.filter(x=>x.change>0).length);document.getElementById('down').textContent=fmt(stocks.filter(x=>x.change<0).length);document.getElementById('status').textContent=`最近擷取：${d.fetched_at||'未知'}；官方行情日期：${d.date_verified?d.market_date:'未驗證（請勿視為當日）'}。TWSE：${d.sources?.TWSE?.rows||0} 筆；TPEx：${d.sources?.TPEx?.rows||0} 筆。`;render()}).catch(e=>{document.getElementById('status').textContent=`尚無可顯示的官方資料：${e.message}。請先執行 GitHub Actions 更新。`});</script></body></html>
